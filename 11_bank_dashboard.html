<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FraudShield Ops Console</title>
<style>
  :root {
    --bg: #0a0f1a;
    --panel: #10192b;
    --panel-raised: #16233b;
    --border: #223050;
    --text: #e8edf5;
    --muted: #7c8aa8;
    --muted-dim: #4d5a75;
    --danger: #ff4d6d;
    --danger-dim: #3a1420;
    --warning: #ff9800;
    --warning-dim: #331a00;
    --safe: #22d3a5;
    --safe-dim: #0f2e28;
    --amber: #f5b942;
    --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(34, 211, 165, 0.04), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255, 77, 109, 0.04), transparent 40%);
  }

  .app { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }

  /* ---- Header ---- */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--safe), #0f8f74);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #05130f;
  }
  .brand-name { font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
  .brand-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }

  .status-cluster { display: flex; align-items: center; gap: 22px; }
  .status-item { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-dim); }
  .dot.live { background: var(--safe); box-shadow: 0 0 8px var(--safe); animation: pulse 2s infinite; }
  .dot.off { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ---- Sidebar: transaction feed ---- */
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    max-height: calc(100vh - 63px);
  }
  .sidebar-header {
    padding: 18px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .refresh-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: var(--mono); font-size: 10.5px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .refresh-btn:hover { border-color: var(--safe); color: var(--safe); }

  .txn-item {
    padding: 13px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.15s;
  }
  .txn-item:hover { background: var(--panel-raised); }
  .txn-item.selected { background: var(--panel-raised); border-left: 3px solid var(--safe); padding-left: 17px; }
  .txn-id { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
  .txn-meta { font-family: var(--mono); font-size: 10px; color: var(--muted-dim); margin-top: 3px; }
  .txn-badge {
    font-family: var(--mono); font-size: 9.5px; padding: 2px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  }
  .txn-badge.pending { background: rgba(124,138,168,0.15); color: var(--muted); }
  .txn-badge.analyzed-block { background: var(--danger-dim); color: var(--danger); }
  .txn-badge.analyzed-clear { background: var(--safe-dim); color: var(--safe); }

  /* ---- Main panel ---- */
  .main { padding: 32px 40px; max-width: 900px; }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; color: var(--muted); gap: 10px; }
  .empty-state-icon { font-size: 34px; opacity: 0.4; }
  .empty-state-text { font-family: var(--mono); font-size: 13px; }

  .analysis-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
  .analysis-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .analysis-id { font-family: var(--mono); font-size: 22px; font-weight: 600; margin-top: 4px; }

  .verdict-banner {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 22px; border-radius: 12px; margin-bottom: 32px;
    border: 1px solid;
  }
  .verdict-banner.block { background: var(--danger-dim); border-color: rgba(255,77,109,0.35); }
  .verdict-banner.clear { background: var(--safe-dim); border-color: rgba(34,211,165,0.35); }
  .verdict-icon { font-size: 26px; }
  .verdict-text-main { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
  .verdict-banner.block .verdict-text-main { color: var(--danger); }
  .verdict-banner.clear .verdict-text-main { color: var(--safe); }
  .verdict-text-sub { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .gauge-row { display: grid; grid-template-columns: 220px 1fr; gap: 40px; margin-bottom: 32px; align-items: center; }
  .gauge-wrap { position: relative; width: 220px; height: 220px; }
  .gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge-score { font-family: var(--mono); font-size: 34px; font-weight: 700; }
  .gauge-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .layer-breakdown { display: flex; flex-direction: column; gap: 16px; }
  .layer-row { display: grid; grid-template-columns: 130px 1fr 56px; align-items: center; gap: 12px; }
  .layer-name { font-size: 12.5px; color: var(--muted); }
  .layer-bar-track { height: 8px; background: var(--panel-raised); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .layer-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .layer-bar-fill.ae { background: linear-gradient(90deg, #4a5fc1, #6d84e8); }
  .layer-bar-fill.tf { background: linear-gradient(90deg, #d63d5f, #ff4d6d); }
  .layer-value { font-family: var(--mono); font-size: 12.5px; text-align: right; }

  .section-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

  .explanation-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 28px;
  }
  .explanation-item { display: flex; gap: 10px; font-size: 13px; color: var(--text); padding: 5px 0; }
  .explanation-item::before { content: "▸"; color: var(--muted); }

  .ground-truth-row { display: flex; align-items: center; gap: 14px; }
  .reveal-btn {
    background: var(--panel-raised); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 11.5px; padding: 8px 16px; border-radius: 7px; cursor: pointer;
  }
  .reveal-btn:hover { border-color: var(--muted); }
  .truth-result { font-family: var(--mono); font-size: 12.5px; display: none; align-items: center; gap: 8px; }
  .truth-result.shown { display: flex; }
  .truth-tag { padding: 3px 9px; border-radius: 5px; font-weight: 600; }
  .truth-tag.match { background: var(--safe-dim); color: var(--safe); }
  .truth-tag.mismatch { background: rgba(245,185,66,0.15); color: var(--amber); }

  .loading-state { display: flex; align-items: center; gap: 12px; color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 40px 0; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--safe); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .config-note {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted-dim);
    padding: 10px 20px; border-top: 1px solid var(--border);
  }

  /* Metrics Dashboard */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .metric-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .metric-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .metric-value {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .metric-subtext {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted-dim);
  }

  /* Risk Level Badges */
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .risk-badge.high { background: var(--danger-dim); color: var(--danger); }
  .risk-badge.medium { background: var(--warning-dim); color: var(--warning); }
  .risk-badge.low { background: var(--safe-dim); color: var(--safe); }

  .risk-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .risk-indicator.high { background: var(--danger); }
  .risk-indicator.medium { background: var(--warning); }
  .risk-indicator.low { background: var(--safe); }

  .error-banner {
    background: var(--danger-dim);
    border: 1px solid rgba(255,77,109,0.35);
    border-radius: 10px;
    padding: 16px;
    color: var(--danger);
    font-size: 13px;
    margin-bottom: 24px;
    display: none;
  }

  .error-banner.shown { display: block; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">FS</div>
      <div>
        <div class="brand-name">FraudShield Ops Console</div>
        <div class="brand-sub">Live transaction risk monitoring</div>
      </div>
    </div>
    <div class="status-cluster">
      <div class="status-item"><span class="dot" id="apiDot"></span><span id="apiStatus">Checking API…</span></div>
      <div class="status-item"><span id="clock"></span></div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Recent Transactions</span>
      <button class="refresh-btn" onclick="loadTransactions()">↻ Refresh</button>
    </div>
    <div id="txnList"></div>
  </div>

  <div class="main" id="mainPanel">
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Transactions Scored</div>
        <div class="metric-value" id="metricTotal">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">High-Risk Alerts</div>
        <div class="metric-value" id="metricAlerts">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Average Risk Score</div>
        <div class="metric-value" id="metricAvgScore">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Average Latency</div>
        <div class="metric-value" id="metricLatency">—</div>
      </div>
    </div>
    <div class="empty-state">
      <div class="empty-state-icon">◎</div>
      <div class="empty-state-text">Select a transaction to run live fraud analysis</div>
    </div>
  </div>
</div>

<div class="config-note">API: http://127.0.0.1:8000 — start with: uvicorn 09_api:app --reload</div>

<script>
const API = "http://127.0.0.1:8000";
let selectedId = null;
let metrics = {
  totalScored: 0,
  highRiskAlerts: 0,
  avgLatency: [],
  scores: []
};

function tick() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}
setInterval(tick, 1000); tick();

async function checkHealth() {
  const dot = document.getElementById("apiDot");
  const label = document.getElementById("apiStatus");
  try {
    const res = await fetch(`${API}/health`);
    const data = await res.json();
    const txnCount = data.transactions_available || 0;
    dot.className = "dot live";
    label.textContent = `API online — ${txnCount.toLocaleString()} transactions`;
  } catch (e) {
    dot.className = "dot off";
    label.textContent = "API unreachable";
  }
}

function getRiskLevel(score) {
  if (score >= 0.8) return "high";
  if (score >= 0.5) return "medium";
  return "low";
}

function getRiskBadge(score) {
  const level = getRiskLevel(score);
  const labels = { high: "HIGH RISK", medium: "MEDIUM RISK", low: "LOW RISK" };
  return `<div class="risk-badge ${level}"><span class="risk-indicator ${level}"></span>${labels[level]}</div>`;
}

function updateMetrics() {
  const totalEl = document.getElementById("metricTotal");
  const alertsEl = document.getElementById("metricAlerts");
  const latencyEl = document.getElementById("metricLatency");
  const avgScoreEl = document.getElementById("metricAvgScore");

  if (totalEl) totalEl.textContent = metrics.totalScored;
  if (alertsEl) alertsEl.textContent = metrics.highRiskAlerts;
  
  if (metrics.avgLatency.length > 0) {
    const avg = metrics.avgLatency.reduce((a,b) => a+b) / metrics.avgLatency.length;
    if (latencyEl) latencyEl.textContent = avg.toFixed(1) + " ms";
  }

  if (metrics.scores.length > 0) {
    const avg = metrics.scores.reduce((a,b) => a+b) / metrics.scores.length;
    if (avgScoreEl) avgScoreEl.textContent = (avg * 100).toFixed(1) + "%";
  }
}

async function loadTransactions() {
  const list = document.getElementById("txnList");
  list.innerHTML = `<div class="loading-state" style="padding:20px"><div class="spinner"></div>Loading…</div>`;
  try {
    const res = await fetch(`${API}/transactions/sample?limit=15`);
    const data = await res.json();
    const txns = data.transactions || [];
    list.innerHTML = "";
    
    txns.forEach(t => {
      const el = document.createElement("div");
      el.className = "txn-item";
      el.id = `txn-${t.transaction_id}`;
      el.innerHTML = `
        <div>
          <div class="txn-id">TXN #${t.transaction_id}</div>
          <div class="txn-meta">test set</div>
        </div>
        <span class="txn-badge pending">pending</span>
      `;
      el.onclick = () => analyzeTransaction(t.transaction_id, t.true_label, el);
      list.appendChild(el);
    });
  } catch (e) {
    list.innerHTML = `<div class="loading-state" style="padding:20px">⚠ Failed to load transactions</div>`;
  }
}

function gaugeSVG(score) {
  const pct = Math.max(0, Math.min(1, score));
  const r = 90, circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - pct);
  const color = pct >= 0.8 ? "var(--danger)" : pct >= 0.5 ? "var(--warning)" : "var(--safe)";
  return `
    <svg width="220" height="220" viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="${r}" fill="none" stroke="var(--border)" stroke-width="14"/>
      <circle cx="110" cy="110" r="${r}" fill="none" stroke="${color}" stroke-width="14"
        stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
        stroke-linecap="round" transform="rotate(-90 110 110)"
        style="transition: stroke-dashoffset 0.8s ease;"/>
    </svg>
  `;
}

async function analyzeTransaction(id, trueLabel, el) {
  document.querySelectorAll(".txn-item").forEach(e => e.classList.remove("selected"));
  el.classList.add("selected");
  selectedId = id;

  const main = document.getElementById("mainPanel");
  main.innerHTML = `<div class="loading-state"><div class="spinner"></div>Running inference…</div>`;

  try {
    const res = await fetch(`${API}/predict_by_id/${id}`);
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Failed to predict");
    }
    const r = await res.json();

    // Update badge
    const badge = el.querySelector(".txn-badge");
    badge.textContent = r.flagged ? "blocked" : "cleared";
    badge.className = "txn-badge " + (r.flagged ? "analyzed-block" : "analyzed-clear");

    // Update metrics
    metrics.totalScored++;
    if (r.flagged) metrics.highRiskAlerts++;
    metrics.avgLatency.push(r.inference_latency_ms);
    metrics.scores.push(r.fused_score);
    updateMetrics();

    const riskLevel = getRiskLevel(r.fused_score);
    const riskDecision = r.flagged ? "BLOCKED" : "CLEARED";
    const riskIcon = r.flagged ? "⛔" : "✓";

    main.innerHTML = `
      <div class="analysis-header">
        <div>
          <div class="analysis-title">Transaction Analysis</div>
          <div class="analysis-id">TXN #${r.transaction_id}</div>
        </div>
      </div>

      <div class="verdict-banner ${r.flagged ? 'block' : 'clear'}">
        <div class="verdict-icon">${riskIcon}</div>
        <div>
          <div class="verdict-text-main">TRANSACTION ${riskDecision}</div>
          <div class="verdict-text-sub">fused risk ${(r.fused_score * 100).toFixed(1)}% — threshold 82.1%</div>
        </div>
      </div>

      <div class="gauge-row">
        <div class="gauge-wrap">
          ${gaugeSVG(r.fused_score)}
          <div class="gauge-center">
            <div class="gauge-score">${(r.fused_score * 100).toFixed(0)}%</div>
            <div class="gauge-label">Fused Risk</div>
          </div>
        </div>
        <div class="layer-breakdown">
          <div class="section-label" style="margin-bottom:2px">Model Layer Breakdown</div>
          <div class="layer-row">
            <div class="layer-name">Transformer (80%)</div>
            <div class="layer-bar-track"><div class="layer-bar-fill tf" style="width:${r.transformer_score * 100}%"></div></div>
            <div class="layer-value">${(r.transformer_score * 100).toFixed(1)}%</div>
          </div>
          <div class="layer-row">
            <div class="layer-name">Autoencoder (20%)</div>
            <div class="layer-bar-track"><div class="layer-bar-fill ae" style="width:${r.autoencoder_score * 100}%"></div></div>
            <div class="layer-value">${(r.autoencoder_score * 100).toFixed(1)}%</div>
          </div>
        </div>
      </div>

      <div class="section-label" style="margin-top: 24px;">Decision Details</div>
      <div class="explanation-box">
        <div class="explanation-item"><strong>Status:</strong> ${getRiskBadge(r.fused_score)}</div>
        <div class="explanation-item"><strong>Inference:</strong> ${r.explanation}</div>
        <div class="explanation-item"><strong>Latency:</strong> ${r.inference_latency_ms.toFixed(2)} ms</div>
      </div>

      <div class="section-label" style="margin-top: 24px;">Verification</div>
      <div class="ground-truth-row">
        <button class="reveal-btn" onclick="revealTruth(${r.true_label}, ${r.flagged})">Reveal ground truth</button>
        <div class="truth-result" id="truthResult"></div>
      </div>
    `;
  } catch (e) {
    main.innerHTML = `
      <div class="error-banner shown" style="display:block">
        ⚠ Error: ${e.message}
      </div>
    `;
  }
}

function revealTruth(trueLabel, flagged) {
  const el = document.getElementById("truthResult");
  const wasCorrect = (trueLabel === 1) === flagged;
  el.className = "truth-result shown";
  el.innerHTML = `
    <span>True label: <strong>${trueLabel === 1 ? "FRAUD" : "LEGITIMATE"}</strong></span>
    <span class="truth-tag ${wasCorrect ? 'match' : 'mismatch'}">${wasCorrect ? "✓ CORRECT" : "✗ MISSED"}</span>
  `;
}

checkHealth();
loadTransactions();
setInterval(checkHealth, 10000);
</script>

</body>
</html>
